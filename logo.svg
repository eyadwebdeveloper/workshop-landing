<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">WorkShop Dashboard</title>
  <desc id="d">An oil drop containing rising dashboard bars inside a circular badge.</desc>

  <!-- Badge -->
  <circle cx="100" cy="100" r="96" fill="#142D25"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#D6B56D" stroke-width="3"/>

  <!-- Oil drop -->
  <path d="M100 36 C100 36 60 82 60 112 A40 40 0 0 0 140 112 C140 82 100 36 100 36 Z" fill="#D6B56D"/>

  <!-- Dashboard bars -->
  <rect x="80" y="114" width="12" height="20" rx="2" fill="#142D25"/>
  <rect x="94" y="102" width="12" height="32" rx="2" fill="#142D25"/>
  <rect x="108" y="88" width="12" height="46" rx="2" fill="#142D25"/>

  <!-- Drop highlight -->
  <path d="M73 106 C73 96 79 86 87 76" fill="none" stroke="#F5F2EA" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Base line / dipstick scale -->
  <rect x="54" y="152" width="92" height="4" rx="2" fill="#F5F2EA"/>
  <circle cx="68" cy="164" r="2.5" fill="#D6B56D"/>
  <circle cx="84" cy="164" r="2.5" fill="#D6B56D"/>
  <circle cx="100" cy="164" r="2.5" fill="#D6B56D"/>
  <circle cx="116" cy="164" r="2.5" fill="#D6B56D"/>
  <circle cx="132" cy="164" r="2.5" fill="#D6B56D"/>
</svg>
